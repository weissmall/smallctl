# smallctl example configuration
#
# The server reads this file at startup and hot-reloads on changes.
# Place in: $XDG_CONFIG_HOME/<binary>/config.yaml
#   (e.g., ~/.config/smallctl/config.yaml)
#
# All fields are optional — the server starts with an empty config
# and logs a warning if no config file is found.
#
# You can also split this file: any *.yaml file placed next to it with a
# commands section is an env file named after the file (dms.yaml → env
# "dms", commands written as plain strings). Files without a commands
# section merge their options. See docs/CONFIGURATION.md for details.

# ── Global server options ─────────────────────────────────────────
options:
  # Optional environment presets for `smallctl web-config`. They make
  # environment-specific command fields available throughout the UI.
  # environments: [noctalia, dms, laptop]

  # Command whose stdout determines the current environment name.
  # Overrides $SMALLCTL_ENV if set. Re-run on each hot-reload.
  # env_command: "hostname"

  # Log verbosity: 0=quiet, 1=errors, 2=warnings, 3=info, 4=debug, 5=verbose.
  # log_level: 3

  # Log file path. Empty = no file logging. Default: $XDG_DATA_HOME/<binary>/log
  # Supports ~ and $VAR expansion (e.g. "$HOME/.config/smallctl/log").
  # Read at startup — restart the server to change it.
  # log_file: ""

  # Desktop notifications: "off" | "error" | "all"
  # notify: "off"

  # Per-command execution timeout in seconds. 0 = no timeout.
  # timeout: 30

  # Shell binary used for command execution.
  # shell: "bash"

# ── Command definitions ───────────────────────────────────────────
commands:
  # Increase screen brightness.
  brightnessIncrease:
    description: "Increase screen brightness"
    args:
      step: 10
    envs:
      noctalia: "noctalia-shell ipc brightness increase ${step}"
      dms: "dms brightness increment ${step}"
    fallback:
      - "brightnessctl set +${step}%"
      - "xbacklight -inc ${step}"

  # Decrease screen brightness.
  brightnessDecrease:
    description: "Decrease screen brightness"
    args:
      step: 10
    envs:
      noctalia: "noctalia-shell ipc brightness decrease ${step}"
      dms: "dms brightness decrement ${step}"
    fallback:
      - "brightnessctl set ${step}%-"
      - "xbacklight -dec ${step}"

  # Increase volume.
  volumeUp:
    description: "Increase volume"
    args:
      step: 5
    envs:
      noctalia: "noctalia-shell ipc volume increase ${step}"
    fallback:
      - "pactl set-sink-volume @DEFAULT_SINK@ +${step}%"
      - "amixer sset Master ${step}%+"

  # Decrease volume.
  volumeDown:
    description: "Decrease volume"
    args:
      step: 5
    envs:
      noctalia: "noctalia-shell ipc volume decrease ${step}"
    fallback:
      - "pactl set-sink-volume @DEFAULT_SINK@ -${step}%"
      - "amixer sset Master ${step}%-"

  # Toggle mute.
  volumeMute:
    description: "Toggle audio mute"
    envs:
      noctalia: "noctalia-shell ipc volume mute"
    fallback:
      - "pactl set-sink-mute @DEFAULT_SINK@ toggle"
      - "amixer sset Master toggle"

  # Lock the screen.
  lockScreen:
    description: "Lock the screen"
    fallback:
      - "loginctl lock-session"

  # Open a terminal emulator.
  openTerminal:
    description: "Open terminal emulator"
    envs:
      lab: "alacritty"
      desktop: "wezterm start"
      laptop: "foot"
    fallback:
      - "xterm"

  # Take a screenshot.
  screenshot:
    description: "Take a screenshot"
    args:
      mode: "region"
    envs:
      noctalia: "noctalia-shell ipc screenshot ${mode}"
    fallback:
      - "grim -g \"$(slurp)\" ~/Pictures/screenshot-$(date +%s).png"
